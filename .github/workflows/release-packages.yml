name: Release Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version override. Defaults to the VERSION file in the repository.
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          source packaging/release/version.sh
          version="$(resolve_release_version '${{ inputs.version }}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify-project:
    name: Verify project (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            at-spi2-core \
            dbus \
            dbus-user-session \
            libadwaita-1-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libspelling-1-dev \
            xvfb

      - name: Verify project
        run: |
          swift build
          xvfb-run -a dbus-run-session -- bash -lc \
            "swift test --filter 'CLICommandTests|CLITests|MainWindowActionsTests|MainWindowCoreTests|MarkdownFormattingTests|NoteModelAndRendererTests|RepositoryStateTests|SettingsStoreTests' --no-parallel"

  prepare-install-roots:
    name: Prepare install root (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - resolve-version
      - verify-project
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            desktop-file-utils \
            libadwaita-1-dev \
            libcurl4-openssl-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libspelling-1-dev

      - name: Verify project
        run: |
          swift build
          swift test --filter 'CLICommandTests|CLITests|NoteModelAndRendererTests|RepositoryStateTests|SettingsStoreTests' --no-parallel

      - name: Assemble /usr install root
        run: |
          packaging/release/assemble-install-root.sh \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --repo-slug "${{ github.repository }}" \
            --repo-ref "${{ github.sha }}" \
            --dest packaging/out/install-root-usr \
            --prefix /usr

      - name: Archive /usr install root
        run: |
          tar -C packaging/out/install-root-usr -czf \
            "packaging/out/swifty-notes-gtk-${{ needs.resolve-version.outputs.version }}-linux-${{ matrix.arch }}-install-root.tar.gz" \
            .

      - name: Upload /usr install root
        uses: actions/upload-artifact@v7
        with:
          name: swifty-notes-gtk-${{ needs.resolve-version.outputs.version }}-linux-${{ matrix.arch }}-install-root.tar.gz
          path: packaging/out/swifty-notes-gtk-${{ needs.resolve-version.outputs.version }}-linux-${{ matrix.arch }}-install-root.tar.gz

  build-deb:
    name: Build Debian package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - resolve-version
      - prepare-install-roots
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download /usr install root
        uses: actions/download-artifact@v8
        with:
          name: swifty-notes-gtk-${{ needs.resolve-version.outputs.version }}-linux-${{ matrix.arch }}-install-root.tar.gz
          path: packaging/out/install-root-archive

      - name: Extract /usr install root
        run: |
          rm -rf packaging/out/install-root-usr
          mkdir -p packaging/out/install-root-usr
          tar -C packaging/out/install-root-usr -xzf \
            "packaging/out/install-root-archive/swifty-notes-gtk-${{ needs.resolve-version.outputs.version }}-linux-${{ matrix.arch }}-install-root.tar.gz"

      - name: Build Debian package
        run: |
          packaging/release/build-deb.sh \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --install-root packaging/out/install-root-usr \
            --output packaging/out/deb

      - name: Resolve Debian artifact
        id: deb-artifact
        run: |
          set -- packaging/out/deb/*.deb
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one Debian artifact, found: $*" >&2
            exit 1
          fi
          echo "path=$1" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$1")" >> "$GITHUB_OUTPUT"

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.deb-artifact.outputs.name }}
          path: ${{ steps.deb-artifact.outputs.path }}

  build-rpm:
    name: Build RPM package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - resolve-version
      - prepare-install-roots
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install RPM build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Download /usr install root
        uses: actions/download-artifact@v8
        with:
          name: swifty-notes-gtk-${{ needs.resolve-version.outputs.version }}-linux-${{ matrix.arch }}-install-root.tar.gz
          path: packaging/out/install-root-archive

      - name: Extract /usr install root
        run: |
          rm -rf packaging/out/install-root-usr
          mkdir -p packaging/out/install-root-usr
          tar -C packaging/out/install-root-usr -xzf \
            "packaging/out/install-root-archive/swifty-notes-gtk-${{ needs.resolve-version.outputs.version }}-linux-${{ matrix.arch }}-install-root.tar.gz"

      - name: Build RPM package
        run: |
          packaging/release/build-rpm.sh \
            --version "${{ needs.resolve-version.outputs.version }}" \
            --install-root packaging/out/install-root-usr \
            --output packaging/out/rpm

      - name: Resolve RPM artifact
        id: rpm-artifact
        run: |
          set -- packaging/out/rpm/*.rpm
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one RPM artifact, found: $*" >&2
            exit 1
          fi
          echo "path=$1" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$1")" >> "$GITHUB_OUTPUT"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.rpm-artifact.outputs.name }}
          path: ${{ steps.rpm-artifact.outputs.path }}

  build-macos:
    name: Build macOS DMG
    # Reuses release-macos.yml so the orchestrated release produces
    # the signed/notarized/stapled DMG alongside the Linux artifacts
    # under the same Run. release-macos.yml stays
    # `workflow_dispatch`-triggerable for one-off / hotfix DMG builds
    # outside the full orchestration.
    needs: resolve-version
    uses: ./.github/workflows/release-macos.yml
    with:
      version: ${{ needs.resolve-version.outputs.version }}
    # Signing / notarization secrets live at the repo level; `inherit`
    # passes all of them to the reusable workflow so we don't have to
    # list each one (MACOS_CERTIFICATE_P12_BASE64,
    # MACOS_CERTIFICATE_P12_PASSWORD, MACOS_DEVELOPER_ID_APPLICATION,
    # MACOS_NOTARIZATION_APPLE_ID, MACOS_NOTARIZATION_TEAM_ID,
    # MACOS_NOTARIZATION_APP_PASSWORD) twice.
    secrets: inherit

  draft-release:
    name: Draft GitHub release
    runs-on: ubuntu-24.04
    needs:
      - resolve-version
      - prepare-install-roots
      - build-deb
      - build-rpm
      - build-macos

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-artifacts -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" release-assets/
          done
          ls -al release-assets

      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          name: ${{ needs.resolve-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: Release drafted automatically. Update notes before publishing.
          draft: true
          files: release-assets/*
